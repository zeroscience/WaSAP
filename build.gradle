plugins {
    id 'java'
}

group 'com.wasap'
version '2.5.2'

repositories {
    mavenCentral()
}

dependencies {
    // Montoya API only. Burp bundles it at runtime, so it is compileOnly and
    // must not be packaged into the extension jar. No other dependencies are
    // required: WaSAP is a pure Montoya scanner extension. 2026.7 provides the
    // split PassiveScanCheck / ActiveScanCheck registration API.
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2026.7'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    archiveBaseName = 'WaSAP'
}
